name: Publish NuGet

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # OIDC token for NuGet Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version from tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      # Pack only the four publishable projects explicitly. Packing the whole
      # solution would try to build DataVo.Browser, which needs the wasm-tools
      # workload (NETSDK1147) that isn't on the runner.
      - name: Pack
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          PROJECTS="DataVo.Core/DataVo.Core.csproj \
                    DataVo.Data/DataVo.Data.csproj \
                    DataVo.EntityFrameworkCore/DataVo.EntityFrameworkCore.csproj \
                    DataVo.Generators/DataVo.Generators.csproj"
          for proj in $PROJECTS; do
            if [ -n "$VERSION" ]; then
              dotnet pack "$proj" -c Release -p:Version="$VERSION" -o artifacts/packages
            else
              dotnet pack "$proj" -c Release -o artifacts/packages
            fi
          done

      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived
      # (~1h) nuget.org API key. Requested right before the push so it can't
      # expire. Needs a matching Trusted Publishing policy on nuget.org.
      - name: NuGet login (Trusted Publishing)
        if: github.ref_type == 'tag'
        uses: NuGet/login@v1
        id: login
        with:
          user: arintonakos

      - name: Push to NuGet
        if: github.ref_type == 'tag'
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
