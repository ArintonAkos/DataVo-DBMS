name: Randomized correctness

# Long randomized runs: the LSM engine against a dictionary model (with crashes and reopens), and random
# SQL against SQLite. The default CI run uses a few fixed seeds; these runs use many fresh seeds each
# night, because the bugs they find hide in rare interleavings (one needed 40 seeds x 1500 steps).
# A failure message names its seed: rerun it locally with DATAVO_SEED_OFFSET=<seed - 1> and SEEDS=1.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: Seeds per test
        default: "40"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  randomized:
    name: Randomized (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      DATAVO_SEED_OFFSET: ${{ github.run_number }}000
      DATAVO_MODEL_SEEDS: ${{ inputs.seeds || '40' }}
      DATAVO_MODEL_STEPS: "1500"
      DATAVO_DIFF_SEEDS: ${{ inputs.seeds || '40' }}
      DATAVO_DIFF_STEPS: "1000"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build DataVo.Tests/DataVo.Tests.csproj -c Release

      - name: Randomized tests
        run: >-
          dotnet test DataVo.Tests/DataVo.Tests.csproj -c Release --no-build
          --filter "FullyQualifiedName~LsmModelBasedTests|FullyQualifiedName~SqliteDifferentialTests"
          --logger "trx;LogFileName=randomized.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: randomized-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: ignore
