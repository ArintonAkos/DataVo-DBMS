name: Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Research benchmark matrix on ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-latest
          - label: windows-x64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install sqlite-vec loadable extension
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          SQLITE_VEC_VERSION="0.1.9"
          SQLITE_VEC_ARCHIVE="sqlite-vec-${SQLITE_VEC_VERSION}-loadable-linux-x86_64.tar.gz"
          SQLITE_VEC_URL="https://github.com/asg017/sqlite-vec/releases/download/v${SQLITE_VEC_VERSION}/${SQLITE_VEC_ARCHIVE}"
          SQLITE_VEC_SHA256="b959baa1d8dc88861b1edb337b8587178cdcb12d60b4998f9d10b6a82052d5d7"
          SQLITE_VEC_DIR="${RUNNER_TEMP}/sqlite-vec"

          mkdir -p "$SQLITE_VEC_DIR"
          curl -sSfL "$SQLITE_VEC_URL" -o "${SQLITE_VEC_DIR}/${SQLITE_VEC_ARCHIVE}"
          echo "${SQLITE_VEC_SHA256}  ${SQLITE_VEC_DIR}/${SQLITE_VEC_ARCHIVE}" | sha256sum -c -
          echo "${SQLITE_VEC_SHA256}  ${SQLITE_VEC_ARCHIVE}" > "${SQLITE_VEC_DIR}/checksums.txt"
          tar -xzf "${SQLITE_VEC_DIR}/${SQLITE_VEC_ARCHIVE}" -C "$SQLITE_VEC_DIR"
          test -f "${SQLITE_VEC_DIR}/vec0.so"

          echo "SQLITE_VEC_PATH=${SQLITE_VEC_DIR}/vec0.so" >> "$GITHUB_ENV"
          {
            echo "SQLITE_VEC_VERSION=${SQLITE_VEC_VERSION}"
            echo "SQLITE_VEC_ARCHIVE=${SQLITE_VEC_ARCHIVE}"
            echo "SQLITE_VEC_SHA256=${SQLITE_VEC_SHA256}"
          } >> "$GITHUB_ENV"

      - name: Restore benchmark host
        run: dotnet restore demos/Research.Benchmark/src/Research.Benchmark.Host/Research.Benchmark.Host.csproj

      - name: Build benchmark host
        run: dotnet build demos/Research.Benchmark/src/Research.Benchmark.Host/Research.Benchmark.Host.csproj -c Release --no-restore

      - name: Run full benchmark scenario matrix
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts
          LOG_FILE="artifacts/${{ matrix.label }}-benchmark.log"
          : > "$LOG_FILE"

          scenarios=(
            "simple-exposure"
            "complex-vip"
            "flat-crud"
            "disk-crud-wal"
            "deep-document"
            "concurrent-ops"
            "vector-search"
            "thread-scaling"
            "ycsb-mixed"
            "space-and-recovery"
          )

          {
            echo "DataVo benchmark matrix (${{ matrix.label }})"
            echo "Date: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "System: $(uname -a)"
            echo "sqlite-vec: ${SQLITE_VEC_VERSION:-not installed for this runner} ${SQLITE_VEC_ARCHIVE:+(${SQLITE_VEC_ARCHIVE}, sha256:${SQLITE_VEC_SHA256})}"
            echo "SQLITE_VEC_PATH: ${SQLITE_VEC_PATH:-not set}"
            dotnet --info
          } | tee -a "$LOG_FILE"

          for scenario in "${scenarios[@]}"; do
            {
              echo
              echo "========================================"
              echo "SCENARIO: ${scenario}"
              echo "========================================"
            } | tee -a "$LOG_FILE"

            dotnet run \
              --project demos/Research.Benchmark/src/Research.Benchmark.Host/Research.Benchmark.Host.csproj \
              -c Release \
              --no-build \
              -- \
              --scenario "$scenario" \
              --format markdown \
              --progress-every 10000 \
              2>&1 | tee -a "$LOG_FILE"
          done

      - name: Upload benchmark log
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-log-${{ matrix.label }}
          path: artifacts/${{ matrix.label }}-benchmark.log
          if-no-files-found: error

      - name: Upload sqlite-vec extension
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-vec-linux-x86_64
          path: |
            ${{ runner.temp }}/sqlite-vec/vec0.so
            ${{ runner.temp }}/sqlite-vec/sqlite-vec-0.1.9-loadable-linux-x86_64.tar.gz
            ${{ runner.temp }}/sqlite-vec/checksums.txt
          if-no-files-found: error
