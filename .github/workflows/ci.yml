name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # Build the test projects for every runtime DataVo ships for (see Directory.Build.props).
  DataVoTestTargets: "net8.0;net9.0;net10.0"

jobs:
  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.framework }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Every runtime DataVo.Core and DataVo.Data ship for. Each leg builds the test projects for that target
        # and runs them on that real runtime, so the package's net8.0, net9.0 and net10.0 builds are all tested.
        framework: [net8.0, net9.0, net10.0]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Show installed runtimes
        run: dotnet --list-runtimes

      - name: Build
        run: >-
          dotnet build DataVo.Tests/DataVo.Tests.csproj -c Release -f ${{ matrix.framework }}

      - name: Engine tests
        run: >-
          dotnet test DataVo.Tests/DataVo.Tests.csproj -c Release --no-build -f ${{ matrix.framework }}
          --logger "trx;LogFileName=engine-${{ matrix.framework }}.trx" --results-directory artifacts/test-results

      # The writer-starvation stress tests must run (not be filtered or skipped) and pass on every OS, Windows
      # included; the step reads their outcomes from the engine run's TRX.
      - name: Confirm the writer-starvation stress tests ran and passed
        shell: bash
        run: |
          set -euo pipefail
          trx="artifacts/test-results/engine-${{ matrix.framework }}.trx"
          outcomes=$(grep -o 'testName="[^"]*WriterProgressUnderReadLoadTests[^"]*"[^>]*outcome="[A-Za-z]*"' "$trx" \
            | sed -E 's/testName="([^"]*)".*outcome="([A-Za-z]*)"/\2 \1/')
          echo "$outcomes"
          ran=$(printf '%s\n' "$outcomes" | grep -c . || true)
          passed=$(printf '%s\n' "$outcomes" | grep -c '^Passed ' || true)
          if [ "$ran" -lt 3 ] || [ "$passed" -ne "$ran" ]; then
            echo "::error::Expected the 3 writer-starvation tests to run and pass; ran $ran, passed $passed."
            exit 1
          fi

      - name: Source generator tests
        run: >-
          dotnet test DataVo.Generators.Tests/DataVo.Generators.Tests.csproj -c Release -f ${{ matrix.framework }}
          --logger "trx;LogFileName=generators-${{ matrix.framework }}.trx" --results-directory artifacts/test-results

      - name: Vector data (Microsoft.Extensions.VectorData) tests
        run: >-
          dotnet test tests/DataVo.VectorData.Tests/DataVo.VectorData.Tests.csproj -c Release -f ${{ matrix.framework }}
          --logger "trx;LogFileName=vectordata-${{ matrix.framework }}.trx" --results-directory artifacts/test-results

      # The benchmark harness (and its documentation checks) targets net10.0 only.
      - name: Benchmark harness tests
        if: matrix.framework == 'net10.0'
        run: >-
          dotnet test demos/Research.Benchmark/tests/Research.Benchmark.Tests/Research.Benchmark.Tests.csproj -c Release
          --logger "trx;LogFileName=research-benchmark.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.framework }}
          path: artifacts/test-results
          if-no-files-found: ignore

  aot:
    name: Native AOT fence and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: AOT fence (Core, Data and VectorData build with trim/AOT diagnostics as errors)
        run: bash scripts/check-aot-baseline.sh

      - name: Publish and run the native AOT smoke binary
        run: |
          set -euo pipefail
          dotnet publish DataVo.AotSmoke/DataVo.AotSmoke.csproj -c Release -r linux-x64 -p:PublishAot=true -o artifacts/aot-smoke
          ./artifacts/aot-smoke/DataVo.AotSmoke | tee artifacts/aot-smoke.log
          grep -q "ALL SMOKE CHECKS PASSED" artifacts/aot-smoke.log

  portable:
    name: Portable netstandard2.1 candidate build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build every package target (net8.0, net9.0, net10.0, netstandard2.1)
        run: |
          dotnet build DataVo.Core/DataVo.Core.csproj -c Release
          dotnet build DataVo.Data/DataVo.Data.csproj -c Release
          dotnet build src/DataVo.VectorData/DataVo.VectorData.csproj -c Release
          dotnet build tests/DataVo.GeneratedCodeTargets/DataVo.GeneratedCodeTargets.csproj -c Release

      - name: Install ripgrep (used by the support-claims check)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Verify runtime support claims
        run: bash scripts/check-unity-support-status.sh

  examples:
    name: Examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # The Microsoft.Extensions.AI RAG demo runs offline with its built-in deterministic embedding generator.
      - name: Run the Microsoft.Extensions.AI local RAG demo
        shell: bash
        run: |
          set -euo pipefail
          dotnet run -c Release --project examples/MicrosoftAiLocalRag | tee artifacts-rag.log
          grep -q "RAG demo finished" artifacts-rag.log
