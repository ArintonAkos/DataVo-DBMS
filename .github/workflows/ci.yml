name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Windows has not been validated for the file-lock and crash-recovery suites yet; keep it visible but
    # non-blocking until it is green.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build DataVo.Tests/DataVo.Tests.csproj -c Release

      - name: Engine tests
        run: >-
          dotnet test DataVo.Tests/DataVo.Tests.csproj -c Release --no-build
          --logger "trx;LogFileName=engine.trx" --results-directory artifacts/test-results

      - name: Source generator tests
        run: >-
          dotnet test DataVo.Generators.Tests/DataVo.Generators.Tests.csproj -c Release
          --logger "trx;LogFileName=generators.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: ignore

  aot:
    name: Native AOT fence and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: AOT fence (Core and Data build with trim/AOT diagnostics as errors)
        run: bash scripts/check-aot-baseline.sh

      - name: Publish and run the native AOT smoke binary
        run: |
          set -euo pipefail
          dotnet publish DataVo.AotSmoke/DataVo.AotSmoke.csproj -c Release -r linux-x64 -p:PublishAot=true -o artifacts/aot-smoke
          ./artifacts/aot-smoke/DataVo.AotSmoke | tee artifacts/aot-smoke.log
          grep -q "ALL SMOKE CHECKS PASSED" artifacts/aot-smoke.log

  portable:
    name: Portable netstandard2.1 candidate build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build the experimental portable target
        run: dotnet build DataVo.Core/DataVo.Core.csproj -c Release -p:DataVoEnablePortableTarget=true

      - name: Verify runtime support claims
        run: bash scripts/check-unity-support-status.sh
