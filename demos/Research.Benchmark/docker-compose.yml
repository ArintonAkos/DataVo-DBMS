services:
  postgres:
    image: postgres:16
    container_name: datavo-research-postgres
    environment:
      POSTGRES_USER: datavo
      POSTGRES_PASSWORD: datavo
      POSTGRES_DB: betting_risk
    ports:
      - "54329:5432"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "max_connections=300"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datavo -d betting_risk"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - research-benchmark

  redis:
    image: redis:7
    container_name: datavo-research-redis
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - research-benchmark

networks:
  research-benchmark:
    name: datavo-research-benchmark
